version: 2

models:
  - name: fct_daily_performance
    description: >
      One row per event date, traffic source, traffic medium,
      device category, and country. Provides daily ecommerce
      performance metrics including events, users, sessions,
      transactions, and purchase revenue.

    columns:
      - name: event_date
        description: GA4 event date.
        data_tests:
          - not_null
          
      - name: traffic_source
        description: GA4 traffic source associated with the reporting segment.

      - name: traffic_medium
        description: GA4 traffic medium associated with the reporting segment.

      - name: device_category
        description: Device category associated with the reporting segment.

      - name: country
        description: Country associated with the reporting segment.

      - name: event_count
        description: Number of GA4 events.
        data_tests:
          - not_null

      - name: users
        description: Distinct anonymous GA4 users.
        data_tests:
          - not_null

      - name: sessions
        description: Distinct GA4 sessions.
        data_tests:
          - not_null

      - name: transactions
        description: Distinct ecommerce transactions.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: Total purchase revenue.
        data_tests:
          - not_null

  - name: fct_funnel_performance
    description: >
      One row per session date, traffic source, traffic medium,
      device category, and country. Includes observed stage-reach
      sessions, strict ordered-funnel sessions, valid transactions,
      purchasers, and deduplicated revenue.

    columns:
      - name: session_date
        description: Date on which the session began.
        data_tests:
          - not_null

      - name: traffic_source
        description: GA4 traffic source associated with the session.

      - name: traffic_medium
        description: GA4 traffic medium associated with the session.

      - name: device_category
        description: Device category associated with the session.

      - name: country
        description: Country associated with the session.

      - name: total_sessions
        description: Number of sessions in the reporting segment.
        data_tests:
          - not_null

      - name: users
        description: >
          Distinct users within the reporting segment. This metric
          is not additive across dates or dimensional segments.
        data_tests:
          - not_null

      - name: total_engagement_time_seconds
        description: >
          Total GA4 engagement time across sessions in the reporting
          segment, measured in seconds. Derived from session-level
          engagement time aggregated from event-level engagement_time_msec.
        data_tests:
          - not_null

      - name: view_item_sessions
        description: Sessions containing at least one view_item event.
        data_tests:
          - not_null

      - name: add_to_cart_sessions
        description: Sessions containing at least one add_to_cart event.
        data_tests:
          - not_null

      - name: begin_checkout_sessions
        description: Sessions containing at least one begin_checkout event.
        data_tests:
          - not_null

      - name: shipping_sessions
        description: Sessions containing at least one add_shipping_info event.
        data_tests:
          - not_null

      - name: payment_sessions
        description: Sessions containing at least one add_payment_info event.
        data_tests:
          - not_null

      - name: valid_purchase_sessions
        description: Sessions containing at least one valid deduplicated transaction.
        data_tests:
          - not_null

      - name: purchasers
        description: >
          Distinct purchasers within the reporting segment. This metric
          is not additive across dates or dimensional segments.
        data_tests:
          - not_null

      - name: ordered_cart_sessions
        description: Sessions in which add_to_cart occurred after view_item.

      - name: ordered_checkout_sessions
        description: Sessions reaching begin_checkout after the preceding ordered stages.

      - name: ordered_shipping_sessions
        description: Sessions reaching add_shipping_info after the preceding ordered stages.

      - name: ordered_payment_sessions
        description: Sessions reaching add_payment_info after the preceding ordered stages.

      - name: completed_ordered_funnel_sessions
        description: Sessions completing the entire recorded funnel in chronological order.

      - name: transactions
        description: Number of valid deduplicated transactions.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: Deduplicated purchase revenue.
        data_tests:
          - not_null

      - name: view_to_cart_sessions
        description: Sessions recording view_item followed by add_to_cart.

      - name: cart_to_checkout_sessions
        description: Sessions recording add_to_cart followed by begin_checkout.

      - name: checkout_to_shipping_sessions
        description: Sessions recording begin_checkout followed by add_shipping_info.

      - name: shipping_to_payment_sessions
        description: Sessions recording add_shipping_info followed by add_payment_info.

      - name: payment_to_purchase_sessions
        description: Sessions recording add_payment_info followed by a valid purchase.

  - name: fct_product_performance
    description: >
      Daily product performance combining item interaction events with
      canonical transaction-backed purchase items. Uses normalized item
      name as the cross-funnel product key because GA4 item IDs vary
      between parent products and purchased SKU variants.

    columns:
      - name: product_performance_key
        description: >
          Unique key for the event-date and normalized-product grain.
        data_tests:
          - unique
          - not_null

      - name: event_date
        description: GA4 event date.
        data_tests:
          - not_null

      - name: product_key
        description: >
          Lowercased and whitespace-normalized item name used as the
          cross-funnel product identifier.
        data_tests:
          - not_null

      - name: product_name
        description: Display name reported in the GA4 item array.
        data_tests:
          - not_null

      - name: observed_item_ids
        description: >
          Distinct parent-product or SKU identifiers observed for the
          product during the day. This metric is not additive across dates.
        data_tests:
          - not_null

      - name: product_view_events
        description: >
          Distinct view_item events containing the product. This metric
          is not additive across products because one event can contain
          multiple products.
        data_tests:
          - not_null

      - name: add_to_cart_events
        description: >
          Distinct add_to_cart events containing the product. This metric
          is not additive across products.
        data_tests:
          - not_null

      - name: begin_checkout_events
        description: >
          Distinct begin_checkout events containing the product. This
          metric is not additive across products.
        data_tests:
          - not_null

      - name: product_transactions
        description: >
          Valid deduplicated transactions containing the product. This
          metric is not additive across products because one transaction
          can contain multiple products.
        data_tests:
          - not_null

      - name: units_purchased
        description: Number of purchased product units.
        data_tests:
          - not_null

      - name: item_revenue
        description: >
          Product-attributed revenue from canonical transaction items.
          This can differ slightly from event-level purchase revenue.
        data_tests:
          - not_null

      - name: cart_events_per_view_event
        description: >
          Ratio of add-to-cart events to product-view events. Null when
          no product-view events were recorded.

      - name: transactions_per_view_event
        description: >
          Ratio of product transactions to product-view events. This is
          an aggregate activity ratio, not an ordered user conversion rate.

      - name: revenue_per_view_event
        description: >
          Product-attributed revenue divided by product-view events.
          Null when no product-view events were recorded.

  - name: rpt_funnel_stages
    description: >
      Long-form reporting model for observed ecommerce funnel stage reach.
      Reshapes stage-level session metrics from fct_funnel_performance
      for funnel visualization in BI tools. Sessions are counted when
      they contain the corresponding funnel event and are not required
      to have completed preceding stages.

    columns:
      - name: session_date
        description: Date on which the session began.
        data_tests:
          - not_null

      - name: traffic_source
        description: GA4 traffic source associated with the session.

      - name: traffic_medium
        description: GA4 traffic medium associated with the session.

      - name: device_category
        description: Device category associated with the session.

      - name: country
        description: Country associated with the session.

      - name: funnel_stage
        description: Observed ecommerce funnel stage.
        data_tests:
          - not_null

      - name: stage_order
        description: Numeric position of the stage in the expected purchase journey.
        data_tests:
          - not_null

      - name: stage_sessions
        description: >
          Number of sessions containing the event associated with this
          funnel stage, regardless of whether preceding stages occurred.
        data_tests:
          - not_null

  - name: rpt_ordered_funnel_stages
    description: >
      Long-form reporting model for cumulative ordered ecommerce funnel
      progression. A session is counted at a stage only when it has completed
      that stage and all preceding funnel stages in chronological order.
      Intervening events do not invalidate progression.

    columns:
      - name: session_date
        description: Date on which the session began.
        data_tests:
          - not_null

      - name: traffic_source
        description: GA4 traffic source associated with the session.

      - name: traffic_medium
        description: GA4 traffic medium associated with the session.

      - name: device_category
        description: Device category associated with the session.

      - name: country
        description: Country associated with the session.

      - name: funnel_stage
        description: Stage in the ordered ecommerce purchase funnel.

      - name: stage_order
        description: Numeric position of the stage in the ordered purchase funnel.
        data_tests:
          - not_null

      - name: stage_sessions
        description: >
          Number of sessions reaching this stage after completing all preceding
          funnel stages in chronological order.
        data_tests:
          - not_null

  - name: rpt_funnel_step_conversion
    description: >
      Long-form reporting model for pairwise ecommerce funnel progression.
      Each row represents a funnel transition within a reporting segment
      and provides the additive numerator and denominator required to
      calculate step-to-step conversion rates correctly in BI tools.

    columns:
      - name: session_date
        description: Date on which the session began.
        data_tests:
          - not_null

      - name: traffic_source
        description: GA4 traffic source associated with the reporting segment.

      - name: traffic_medium
        description: GA4 traffic medium associated with the reporting segment.

      - name: device_category
        description: Device category associated with the reporting segment.

      - name: country
        description: Country associated with the reporting segment.

      - name: funnel_step
        description: Human-readable ecommerce funnel transition.
        data_tests:
          - not_null

      - name: step_order
        description: Numeric position of the funnel transition in the purchase journey.
        data_tests:
          - not_null

      - name: starting_sessions
        description: >
          Number of sessions containing the starting stage of the funnel
          transition.
        data_tests:
          - not_null

      - name: progressed_sessions
        description: >
          Number of sessions in which the starting stage was followed
          chronologically by the next funnel stage.
        data_tests:
          - not_null

  - name: rpt_engagement_conversion
    description: >
      Long-form reporting model relating GA4 session engagement time to
      ecommerce outcomes. Groups sessions into ordered engagement-time
      bands while preserving reporting dimensions and additive measures
      so conversion and revenue metrics can be recalculated correctly
      under BI filters.

    columns:
      - name: session_date
        description: Date on which the session began.
        data_tests:
          - not_null

      - name: traffic_source
        description: GA4 traffic source associated with the reporting segment.

      - name: traffic_medium
        description: GA4 traffic medium associated with the reporting segment.

      - name: device_category
        description: Device category associated with the reporting segment.

      - name: country
        description: Country associated with the reporting segment.

      - name: engagement_band
        description: >
          Ordered band of total GA4 engagement time recorded for the session.
        data_tests:
          - not_null

      - name: band_order
        description: Numeric ordering of engagement bands from shortest to longest.
        data_tests:
          - not_null

      - name: sessions
        description: Number of sessions within the engagement-time band and reporting segment.
        data_tests:
          - not_null

      - name: purchase_sessions
        description: Number of sessions within the segment containing a valid purchase.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: >
          Total deduplicated purchase revenue generated by sessions within
          the engagement-time band and reporting segment.
        data_tests:
          - not_null

