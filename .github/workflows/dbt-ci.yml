name: dbt CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-bigquery==1.11.2

      - name: Create CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          ga4_ecommerce_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: ci-placeholder-project
                dataset: ci_placeholder
                location: US
                threads: 4
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Parse dbt project
        run: dbt parse --no-partial-parse